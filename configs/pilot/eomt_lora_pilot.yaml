trainer:
  accelerator: auto
  devices: 1
  precision: 32
  max_epochs: 1
  overfit_batches: 1
  limit_val_batches: 1
  check_val_every_n_epoch: 1
  log_every_n_steps: 1
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      name: eomt-lora-pilot
      save_dir: pilot_logs
  enable_checkpointing: true

# Checkpoints will be saved by Lightning's default ModelCheckpoint when
# enable_checkpointing is true. Use the evaluation script scripts\evaluate_checkpoint.py
# to load a checkpoint and run validation to inspect metrics.

model:
  class_path: training.mask_classification_semantic.MaskClassificationSemantic
  init_args:
    ckpt_path: null
    attn_mask_annealing_enabled: false  # Disabled for 10-step pilot run
    attn_mask_annealing_start_steps: [6520, 13040, 19560, 26080]
    attn_mask_annealing_end_steps: [13040, 19560, 26080, 32600]
    # LoRA and freezing options.
    # Prefer the dict-based lora_config to keep per-block settings explicit and
    # easy to override from the sweep script.
    freeze_backbone: true
    lora_enabled: true
    lora_config:
      "-3,-2,-1":
        rank: 8
        alpha: 1.0
        modules: ["qkv", "proj"]
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_q: 100
        num_blocks: 4
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_reg4_dinov2

data:
  class_path: datasets.ade20k_semantic.ADE20KSemantic
  init_args:
    path: data/ade20k
    batch_size: 1 # size of whole dataset, or just batch?
    num_workers: 0
    img_size: [256, 256]
    debug_overfit: true

compile_disabled: true
