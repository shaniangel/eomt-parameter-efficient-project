trainer:
  accelerator: auto
  devices: 1
  precision: 32
  max_epochs: 10            # Run 1 epoch total
  #overfit_batches: 1
  limit_train_batches: 20   # Run exactly 1 training batch
  limit_val_batches: 10     # Run exactly 1 validation batch
  check_val_every_n_epoch: 1
  log_every_n_steps: 10     # Log every step so metrics record immediately
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      name: eomt-lora-pilot
      save_dir: pilot_logs
  enable_checkpointing: true

model:
  class_path: training.mask_classification_semantic.MaskClassificationSemantic
  init_args:
    ckpt_path: null
    attn_mask_annealing_enabled: false
    attn_mask_annealing_start_steps: [6520, 13040, 19560, 26080]
    attn_mask_annealing_end_steps: [13040, 19560, 26080, 32600]
    freeze_backbone: true
    lora_enabled: true
    lora_config:
      "-3,-2,-1":
        rank: 8
        alpha: 1.0
        modules: [ "qkv", "proj" ]
    lr: 5e-5
    weight_decay: 0.05
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_q: 100
        num_blocks: 4
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_small_patch14_reg4_dinov2

data:
  class_path: datasets.ade20k_semantic.ADE20KSemantic
  init_args:
    path: data/ade20k
    batch_size: 2         # 1 image per batch
    num_workers: 0        # Eliminates multiprocessing overhead on CPU
    img_size: [256, 256]

compile_disabled: true