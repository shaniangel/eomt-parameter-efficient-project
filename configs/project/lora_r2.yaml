# Rank ablation of regime 3: local LoRA as in lora.yaml (rank 8), but with rank 2.
# alpha = rank keeps the scale alpha / rank at 1, so only the rank changes
trainer:
  logger:
    init_args:
      name: lora_r2
model:
  init_args:
    freeze_backbone: true
    lora_rank: 2
    lora_alpha: 2
    lora_modules: [qkv, proj]
